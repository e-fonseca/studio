{% comment %}
Código de recuperar a senha (1.43.0). Estilo em atributo `style=`, e não em folha, pelo
mesmo motivo do e-mail dos relatórios (templates/alertas/email/relatorio.html): o Gmail
descarta <style> e classe. O e-mail fica claro mesmo com o sistema escuro: caixa de
entrada é papel, e cada programa de e-mail escurece do seu jeito.
{% endcomment %}<!doctype html>
<html lang="pt-br"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Código para criar a senha nova</title></head>
<body style="margin:0; padding:0; background:#f5f1ec; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; color:#2b2522;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f1ec; padding:16px 0;">
<tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px; background:#fffdfa; border:1px solid #e3d9cd; border-radius:10px;">
  <tr><td style="background:#2b2018; padding:18px 22px; border-radius:9px 9px 0 0;">
    <div style="color:#f2e6d6; font-size:18px; font-weight:700;">Código para criar a senha nova</div>
    <div style="color:#c4ab8d; font-size:13px; margin-top:3px;">Cabana do Jacarandá · Sistema auxiliar</div>
  </td></tr>
  <tr><td style="padding:22px 22px 6px; font-size:15px; line-height:1.5;">
    <p style="margin:0 0 12px;">Olá, {{ nome }}.</p>
    <p style="margin:0 0 16px;">Alguém pediu para criar uma senha nova para o usuário
      <strong>{{ usuario }}</strong> no sistema da Cabana do Jacarandá. O código é:</p>
    <div style="margin:0 0 16px; padding:14px 0; text-align:center; background:#f6e9dd; border:1px solid #e3c9ae; border-radius:8px; font-size:32px; font-weight:700; letter-spacing:8px; color:#7a3b12; font-family:Consolas,'Courier New',monospace;">{{ codigo }}</div>
    <p style="margin:0 0 12px;">Ele vale até <strong>{{ vale_ate|date:"H:i" }}</strong> de
      {{ vale_ate|date:"d/m/Y" }} ({{ minutos }} minutos) e serve uma vez só. Digite o código
      na tela em que você pediu, junto com a senha nova.</p>
    <p style="margin:0 0 12px; padding:10px 12px; background:#fdf1e3; border-left:4px solid #c0761f; font-size:13px;">
      Não foi você? Ignore este e-mail: a sua senha continua a mesma, e sem o código ninguém
      consegue trocá-la. Se chegar de novo sem você pedir, avise o administrador do sistema.</p>
    <p style="margin:0 0 6px; font-size:13px; color:#6b5d50;">Ninguém da loja pede este
      código por telefone ou mensagem. Não passe o código para ninguém.</p>
  </td></tr>
  <tr><td style="padding:12px 22px 18px; font-size:12px; color:#8a7b6d; border-top:1px solid #e3d9cd;">
    E-mail automático do sistema da Cabana do Jacarandá. Não precisa responder.
  </td></tr>
</table>
</td></tr>
</table>
</body></html>
